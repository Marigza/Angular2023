<mat-card class="card-block">
  <div class="buttons">
    <button mat-raised-button color="primary" type="submit" (click)="update()" [disabled]="isLoad$ | async">
      Update {{ timer$ | async }}
    </button>
  </div>
<con-filter-sorter (newValueEvent)="addFilterValue($event)" (newSortEvent)="addSortValue($event)"></con-filter-sorter>
<ul *ngIf="people$ | async as people" class="person-list">
  <li class="person-item" *ngFor="let person of people; trackBy: trackByIndex">
    <button [conBackground]="person.uid.S" class="people-link" (click)="openDialog(person.uid.S)">
      {{ person.name.S }}
    </button>
  </li>
</ul>
</mat-card>
